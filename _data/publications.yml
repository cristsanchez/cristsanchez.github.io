      - title: "To Profit or not to Profit? Evidence from Chile's For-Profit Voucher Schools"
        url: "/research/files/BSV1.pdf"
        coauthors: "Bárbara Boggiano and Rocío Valdebenito"
        venue: "Applied Economics Letters"
        venue_detail: "accepted"
        abstract: |-
          This note examines whether for-profit management affects educational outcomes in Chile's voucher system. Using administrative panel data for all voucher-subsidized primary schools from 2010 to 2014, we compare for-profit and nonprofit schools in terms of inputs and student performance. For-profit schools serve more disadvantaged students and rely on lower-cost inputs, such as less-qualified teachers, but they also provide more instructional hours and smaller classes. After controlling for student characteristics, a significant test-score gap remains, but it is largely explained by differences in school inputs. These results suggest that ownership matters mainly through differences in how schools allocate educational inputs.
        bibtex: |-
          @article{boggiano2026profit,
            author  = {Bárbara Boggiano and Cristián Sánchez and Rocío Valdebenito},
            title   = {{To Profit or not to Profit? Evidence from Chile's For-Profit Voucher Schools}},
            journal = {Applied Economics Letters},
            year    = {2026},
            note    = {Accepted}
          }
      - title: "The Effects of Educated Leaders on Policy and Politics: Quasi-Experimental Evidence from Brazil"
        url: "https://www.latinaer.org/index.php/laer/article/view/198"
        coauthors: "Paulo Bastos"
        venue: "Latin American Economic Review"
        venue_detail: "Vol. 33, 2024"
        abstract: |-
          We examine whether and how the educational background of political leaders matters for policy choices and outcomes. Using data on municipalities in Brazil from 2000–2008, we estimate the effects of electing a more educated leader in a regression-discontinuity design whereby policy inputs and outcomes in municipalities where a highly educated candidate barely won the election are compared with those of municipalities where a highly educated candidate barely lost. Our results indicate that highly educated mayors make different choices regarding the allocation of public funds and inputs in critical sectors when compared to non-highly educated mayors, yet they do not produce better indicators on a variety of measurable outcomes. Furthermore, our estimates suggest a negative impact of educated mayors on local economic growth and children's health. We additionally document the existence of heterogeneity in the effects of highly educated leaders along political ideology and age of the candidate. Lastly, highly educated leaders are not more likely to be reelected, suggesting that they are not perceived as better politicians.
        bibtex: |-
          @article{bastos2024educated,
            author  = {Paulo Bastos and Cristián Sánchez},
            title   = {{The Effects of Educated Leaders on Policy and Politics: Quasi-Experimental Evidence from Brazil}},
            journal = {Latin American Economic Review},
            volume  = {33},
            year    = {2024},
            doi     = {10.60758/laer.v33i.198}
          }
