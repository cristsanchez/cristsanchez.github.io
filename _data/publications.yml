      - title: "The Schooling and Labor Market Effects of Vouchers"
        url: "/research/files/Schooling_Labor_Vouchers.pdf"
        coauthors: "Tomás Rau and Sergio Urzúa"
        abstract: |-
          We investigate the effects of attending a private-voucher high school on short- and longer-term educational outcomes, namely test scores, college enrollment, and college degree attainment. We do so by estimating a sequential model of schooling decisions and outcomes using data from Chile, a middle-income country with more than thirty of years of experience with a nationwide voucher program. Our model allows for both observed and unobserved characteristics to influence decisions and outcomes, and for heterogeneity in the treatment effect, even after controlling for selection and observed characteristics. We find that attending a voucher high school has positive effects on test scores (0.07σ and 0.01σ in verbal and math, respectively), small effects on college enrollment (1.9 p.p.), and no effects on the likelihood of earning a college degree. We also find substantial heterogeneity in the treatment effects, where in general low-ability students benefit more from vouchers than high-ability students. At the moment, we are in the process of merging our current data with labor market records to uncover the effects of vouchers on employment and wages.
        bibtex: |-
          @unpublished{rau2019schooling,
            author = {Tomás Rau and Cristián Sánchez and Sergio Urzúa},
            title  = {{The Schooling and Labor Market Effects of Vouchers}},
            year   = {2019},
            note   = {Working paper}
          }
      - title: "The Design of Vouchers and Schools' Strategic Behavior: The Case of Chile"
        url: "/research/files/skip_exam_draft.pdf"
        abstract: |-
          I use rich administrative data from Chile and a difference-in-differences strategy to show that the positive effects on test scores of a recent targeted voucher reform found in the literature need to be taken with caution, as I find that the reform significantly decreased the likelihood that low-performing students take the national standardized tests. Specifically, low-performing students are 14.7 percentage points less likely to take the national exams four years after the introduction of the reform, while high-performing students are as likely to take the exams after the introduction of the reform as they were before. Such result cannot be explained by the observed increase in class attendance attributed to the program, but rather suggests a strategic response from schools to the requirement of constantly increasing performance in order to secure the receipt of the new subsidy. The ultimate consequence of this strategic behavior is that the resulting observed distribution of standardized test scores, an instrument that is used by the government to guide many of its policies, and by families to guide their enrollment decisions, may no longer be an accurate representation of the actual distribution, leading to inefficiencies in the allocation of resources.
        bibtex: |-
          @unpublished{sanchez2019design,
            author = {Cristián Sánchez},
            title  = {{The Design of Vouchers and Schools' Strategic Behavior: The Case of Chile}},
            year   = {2019},
            note   = {Working paper}
          }
