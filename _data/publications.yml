# Publications data — drives the Research page and the "Selected work" block on Home.
#
# Per item fields (all optional except title):
#   title         paper title
#   url           link for the title (usually the working-paper PDF)
#   coauthors     "Name One and Name Two"  (rendered as "with …")
#   venue         journal name (italic); use for published work
#   venue_detail  e.g. "Vol. 33, 2024"
#   status        e.g. "R&R · Journal of Political Economy"  (rendered as a tag)
#   status_live   true  -> accent-colored tag (use for R&R / Accepted)
#   coverage      { label:, href: }   press / blog coverage
#   links         [ { label:, href: } ]  extra resources (Online Appendix, Slides, BibTeX…)
#   abstract      optional text -> renders a collapsible "Abstract" toggle
#   featured      true  -> also shown in "Selected work" on the Home page

