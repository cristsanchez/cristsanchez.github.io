title: Cristián Sánchez

description: Cristián Sánchez — applied microeconomist, Visiting Assistant Professor at Universidad de los Andes.

permalink: blog/:year/:month/:day/:title
exclude: ["Makefile", "README.md"]

production_url: https://cristsanchez.github.io/cristian     
BASE_PATH: https://cristsanchez.github.io/cristian

#url: "https://cristsanchez.github.io"

author:
    name:
    facebook:
    scholar:

# Build settings
markdown: kramdown
highlighter: rouge

# Settings for analytics helper
# Set 'provider' to the analytics provider you want to use.
# Set 'provider' to false to turn analytics off globally.
#
analytics:
    provider: false
    statcounter:
        sc_project  :
        sc_security :
        sc_invisible: 1
        sc_text     : 2
    google:
        tracking_id: ''
    getclicky:
      site_id:
    mixpanel:
        token: ''
    piwik:
        baseURL: '' # Piwik installation address (without protocol)
        idsite: ''  # the id of the site on Piwik

# Settings for comments helper
# Set 'provider' to the comment provider you want to use.
# Set 'provider' to false to turn commenting off globally.
#
comments:
    provider: false
    disqus:
      short_name:
    livefyre:
      site_id:
    intensedebate:
      account:
    facebook:
      appid:
      num_posts: 5
      width: 580
      colorscheme: light

# Sitemap
url: "https://cristsanchez.github.io/" # the base hostname & protocol for your site
plugins:
  - jekyll-sitemap

