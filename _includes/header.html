<header class="masthead">
    <a class="wordmark" href="/">{{ site.title }}</a>
    <nav class="nav" aria-label="Main navigation">
        <div class="nav-items">
            {% for item in site.data.menu %}
                {% if item.external %}
                <a class="nav-link" href="{{ item.href }}" target="_blank" rel="noopener">{{ item.title }}</a>
                {% else %}
                <a class="nav-link{% if page.url == item.href %} active{% endif %}" href="{{ item.href }}">{{ item.title }}</a>
                {% endif %}
            {% endfor %}
        </div>
    </nav>
</header>
