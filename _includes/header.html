<header class="masthead">
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <a class="wordmark" href="/">{{ site.title }}</a>
    <nav class="nav" aria-label="Main navigation">
        <div class="nav-items">
            {% for item in site.data.menu %}
                {% if item.external %}
                <a class="nav-link" href="{{ item.href }}" target="_blank" rel="noopener">{{ item.title }}</a>
                {% else %}
                <a class="nav-link{% if page.url == item.href %} active{% endif %}" href="{{ item.href }}">{{ item.title }}</a>
                {% endif %}
            {% endfor %}
        </div>
    </nav>
</header>
